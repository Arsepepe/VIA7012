function renderMasthead(activeWeek, activeRecursos){

    if(activeWeek && w.no < activeWeek) cls += " done";
    if(activeWeek === w.no) cls += " active";
    return `<a class="${cls}" href="#/semana-${String(w.no).padStart(2,"0")}" title="Semana ${w.no} · ${esc(w.title)}"><div class="pdot">${w.no}</div><div class="pname">${esc(w.chip)}</div></a>`;

  document.getElementById("masthead-container").innerHTML = `

      <a class="brand" href="#/">
        <img src="${LOGO_B64}" alt="BIU — Broward International University">

          <div class="name">Introducción a la IA en la Educación Sustentable</div>

}

    const m = path.match(/semana-(\d+)/);
    if(m){ renderWeek(parseInt(m[1],10)); }

}
